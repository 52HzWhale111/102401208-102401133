<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发布信息｜拾光校园</title>
<meta name="description" content="发布一条失物招领信息，填写物品名称、类别、地点、时间和联系方式。">
<link rel="stylesheet" href="shared/app.css">
</head>

<body>
<div class="app" data-shell="back" data-tab="none" data-title="发布信息">

  <div data-layout="header"></div>

  <main class="page">
    <!-- 整张表单（分段控件 + 各字段 + 提交按钮）由 js/form.js 生成，
         页面只在 onSubmit 里决定「拿到一份合法草稿之后干什么」。
         编辑页 edit.html 用的是同一个模块，只是 mode 不同。 -->
    <div id="formHost"></div>
  </main>
</div>

<script src="js/core.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/card.js"></script>
<script src="js/form.js"></script>
<script>
(function () {
  'use strict';

  /* 对应原型画板的「发布寻物」「发布招领」两个画板。
     本页只做「发布」这一件事：把表单交给 js/form.js，校验通过后落库、跳转成功页。
     表单长什么样、哪些字段必填、草稿怎么存，都在 js/form.js 里，这一页不再关心。 */

  LF.layout.init();

  var form = LF.form.mount(document.getElementById('formHost'), {
    mode: 'create',
    /* 从「＋」弹层进来时带 ?kind=lost / ?kind=found，决定分段控件初始选哪个 */
    kind: new URLSearchParams(location.search).get('kind') === 'found' ? 'found' : 'lost',

    onSubmit: function (draft) {
      var item = LF.store.add(draft);
      if (!item) {
        /* store 的兜底校验没过（正常走不到这儿，表单已经先拦过一道），
           给个通用提示，别让用户对着按钮发呆 */
        form.showErrors({ title: '发布失败，请检查填写内容' });
        return;
      }

      form.clearDraft();     /* 发成功了就把草稿清掉，下次进来是干净的一张表 */
      location.href = 'publish-done.html?id=' + encodeURIComponent(item.id);
    }
  });
})();
</script>
</body>
</html>
