<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>搜索｜拾光校园</title>
<meta name="description" content="搜索校园里的失物招领信息，按关键词查找丢失或拾到的物品。">
<link rel="stylesheet" href="shared/app.css">
<style>
  /* 只属于搜索页的样式 */

  /* ---- 搜索框 ---- */
  .search-field { position: relative; margin-top: 14px; }

  .search-field .form-input {
    height: 48px;
    padding: 0 46px 0 42px;      /* 左侧留给放大镜，右侧留给清空按钮 */
    background: var(--card);
    border-color: var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-card);
  }
  /* app.css 的 .form-input:focus 和上面这条优先级相同，靠后加载才生效，
     所以这里补一条更高优先级的，保证聚焦时描边还是变黄 */
  .search-field .form-input:focus { border-color: var(--yellow); }
  /* Chrome 会给 type=search 自带一个 ✕，和我们右边的清空按钮重复 */
  .search-field input::-webkit-search-cancel-button { display: none; }

  .search-icon {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--sub);
    pointer-events: none;
  }

  .search-clear {
    position: absolute; right: 7px; top: 50%;
    transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    font-size: 13px; color: var(--sub);
    border-radius: 50%;
    transition: background .15s, color .15s;
  }
  .search-clear:hover { background: var(--field); color: var(--text); }

  /* ---- 结果计数条 ---- */
  .result-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 20px 2px 11px;
    min-height: 20px;
  }
  .result-count { font-size: 12px; color: var(--sub); }
  .result-reset {
    font-size: 12px; font-weight: 600; color: var(--amber-800);
    text-decoration: underline; text-underline-offset: 2px;
  }
  .result-reset:hover { color: var(--amber-950); }

  /* .result-bar / .item-list / .state-page 都是 flex 容器，
     会盖掉浏览器默认的 [hidden]{display:none}，得显式补一条 */
  .result-bar[hidden],
  .item-list[hidden],
  .state-page[hidden] { display: none; }
</style>
</head>

<body>
<div class="app" data-shell="back" data-tab="search" data-title="搜索">

  <div data-layout="header"></div>

  <main class="page">

    <!-- 搜索框：输入即筛选，不用点按钮 -->
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
      </svg>
      <input class="form-input" id="q" type="search" autocomplete="off"
             placeholder="搜索物品名称、地点、描述" aria-label="搜索失物招领信息">
      <button class="search-clear" id="qClear" type="button" aria-label="清空关键词" hidden>✕</button>
    </div>

    <div class="result-bar" id="resultBar">
      <span class="result-count" id="resultCount"></span>
      <button class="result-reset" id="resetBtn" type="button" hidden>重置筛选</button>
    </div>

    <div class="item-list" id="resultList"></div>

    <!-- 没有结果时的整屏提示 -->
    <div class="state-page" id="empty" hidden>
      <div class="state-icon" aria-hidden="true">🔍</div>
      <h3 class="state-title">没有找到相关信息</h3>
      <p class="state-desc">换个关键词试试，或者去广场逛逛。</p>
      <div class="state-actions">
        <button class="btn btn-secondary" id="emptyReset" type="button">清空关键词</button>
        <a class="btn btn-primary" href="square.html">去广场看看</a>
      </div>
    </div>

  </main>

  <div data-layout="tabbar"></div>
</div>

<script src="js/core.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/card.js"></script>
<script>
(function () {
  'use strict';

  LF.layout.init();

  var elQ      = document.getElementById('q');
  var elClear  = document.getElementById('qClear');
  var elBar    = document.getElementById('resultBar');
  var elCount  = document.getElementById('resultCount');
  var elReset  = document.getElementById('resetBtn');
  var elList   = document.getElementById('resultList');
  var elEmpty  = document.getElementById('empty');

  /* 允许从别处带词跳进来：search.html?q=耳机 */
  var initial = LF.trim(new URLSearchParams(location.search).get('q'));
  if (initial) elQ.value = initial;

  function render() {
    var keyword = LF.trim(elQ.value);
    /* 排序和「返回副本」LF.search 都做了，这里直接用结果 */
    var hit = LF.search(LF.store.all(), { keyword: keyword });
    var hasHit = hit.length > 0;

    elClear.hidden = !keyword;
    elReset.hidden = !keyword;

    /* 一条都没搜到时，把计数条和列表一起收起来，让空状态独占这一屏 */
    elBar.hidden   = !hasHit;
    elList.hidden  = !hasHit;
    elEmpty.hidden = hasHit;

    elCount.textContent = keyword
      ? '找到 ' + hit.length + ' 条匹配结果'
      : '最近发布 · 共 ' + hit.length + ' 条';

    LF.card.renderList(elList, hit);
  }

  function clearKeyword() {
    elQ.value = '';
    render();
    elQ.focus();
  }

  elQ.addEventListener('input', render);
  elClear.addEventListener('click', clearKeyword);
  elReset.addEventListener('click', clearKeyword);
  document.getElementById('emptyReset').addEventListener('click', clearKeyword);

  render();
})();
</script>
</body>
</html>
