<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>搜索｜拾光校园</title>
<meta name="description" content="搜索校园里的失物招领信息，按关键词、类型和物品类别查找丢失或拾到的物品。">
<link rel="stylesheet" href="shared/app.css">
<style>
  /* 只属于搜索页的样式 */

  /* ---- 搜索框 ---- */
  .search-field { position: relative; margin-top: 14px; }

  .search-field .form-input {
    height: 48px;
    padding: 0 46px 0 42px;      /* 左侧留给放大镜，右侧留给清空按钮 */
    background: var(--card);
    border-color: var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-card);
  }
  /* app.css 的 .form-input:focus 和上面这条优先级相同，靠后加载才生效，
     所以这里补一条更高优先级的，保证聚焦时描边还是变黄 */
  .search-field .form-input:focus { border-color: var(--yellow); }
  /* Chrome 会给 type=search 自带一个 ✕，和我们右边的清空按钮重复 */
  .search-field input::-webkit-search-cancel-button { display: none; }

  .search-icon {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--sub);
    pointer-events: none;
  }

  .search-clear {
    position: absolute; right: 7px; top: 50%;
    transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    font-size: 13px; color: var(--sub);
    border-radius: 50%;
    transition: background .15s, color .15s;
  }
  .search-clear:hover { background: var(--field); color: var(--text); }

  /* ---- 筛选面板 ---- */
  .filters {
    margin-top: 14px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-card);
  }
  .filter-row + .filter-row { margin-top: 14px; }

  .filter-label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px; font-weight: 600; color: var(--sub);
  }

  /* 类型是「全部 / 寻物 / 招领」三项，公共样式里的 .segmented 只有两列 */
  .segmented.is-three { grid-template-columns: repeat(3, 1fr); }
  /* 公共样式只给 lost / found 定了激活色，「全部」补一个 */
  .segmented .seg.is-active[data-kind="all"] { color: var(--text); }

  /* ---- 结果计数条 ---- */
  .result-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 20px 2px 11px;
    min-height: 20px;
  }
  .result-count { font-size: 12px; color: var(--sub); }
  .result-reset {
    font-size: 12px; font-weight: 600; color: var(--amber-800);
    text-decoration: underline; text-underline-offset: 2px;
  }
  .result-reset:hover { color: var(--amber-950); }

  /* ---- 空状态插画（原型画板 13）----
     公共的 .state-page 只给了 .state-icon —— 一个光秃秃的 emoji。
     画板 13 画的是一枚「浅黄圆盘 + 白色小狗 + 右下角箱子角标」的插画，
     所以另起一套类名，尺寸和配色都按画板量的：
     圆盘 112×112（含 2px 圈）、盘底 #FBF5E0、圈 #FEE49D；
     角标 34×34，圆心压在圆盘右下角，往外露约 3px，圈色是饱和的 --yellow；
     小狗墨迹 48×48，正好落在圆盘正中（量到圆心和盘心完全重合）。 */
  .empty-art {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 112px; height: 112px;
    background: #FBF5E0;
    border: 2px solid #FEE49D;
    border-radius: 50%;
  }
  .empty-art-dog { font-size: 50px; line-height: 1; }

  .empty-art-badge {
    position: absolute; right: -3px; bottom: -2px;
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    font-size: 18px; line-height: 1;
    background: var(--card);
    border: 2px solid var(--yellow);
    border-radius: 50%;
  }

  /* 画板 13 里插画→标题、说明→按钮都比 .state-page 的默认间距开，补上量到的值 */
  #empty .state-title { margin-top: 34px; }
  #empty .state-actions {
    flex-direction: column;      /* 公共样式是一排，画板里是竖着的两颗 */
    gap: 12px;
    margin-top: 30px;
  }
  /* 两颗按钮在画板里都是 218 宽、居中，不铺满整行 */
  #empty .btn { width: 218px; max-width: 100%; }

  /* 画板 13 的第二颗按钮是「淡蓝底 + 淡蓝描边 + 蓝字」，
     app.css 里 .btn-blue 是实心蓝、.btn-secondary 是白底，都不对。
     底色和描边直接拿 --blue 兑透明度，和画板上量的 (235,243,254)/(187,214,246) 基本吻合。
     蓝字用的就是原型的 --blue，对比度约 2.9:1 —— 按画板还原，没有再加暗。 */
  .btn-soft-blue {
    background: rgba(74, 144, 226, .10);
    border-color: rgba(74, 144, 226, .35);
    color: var(--blue);
  }
  .btn-soft-blue:hover { background: rgba(74, 144, 226, .16); }

  /* .filters / .result-bar / .item-list / .state-page 都是 flex 或 grid 容器，
     会盖掉浏览器默认的 [hidden]{display:none}，得显式补一条。
     .search-clear 也一样（它是个 display:flex 的圆形按钮）—— 漏了这条的时候，
     输入框空着那个 ✕ 也照样显示。browse.html 里同名的那颗一开始就补了。 */
  .filters[hidden],
  .result-bar[hidden],
  .item-list[hidden],
  .state-page[hidden],
  .search-clear[hidden] { display: none; }
</style>
</head>

<body>
<div class="app" data-shell="brand" data-tab="search">

  <div data-layout="header"></div>

  <main class="page">

    <!-- 搜索框：输入即筛选，不用点按钮 -->
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
      </svg>
      <input class="form-input" id="q" type="search" autocomplete="off"
             placeholder="搜索物品名称、地点、描述" aria-label="搜索失物招领信息">
      <button class="search-clear" id="qClear" type="button" aria-label="清空关键词" hidden>✕</button>
    </div>

    <!-- 筛选面板：类型 + 物品类别 -->
    <section class="filters">

      <div class="filter-row">
        <span class="filter-label" id="l-kind">信息类型</span>
        <div class="segmented is-three" id="kindSeg" role="group" aria-labelledby="l-kind">
          <button class="seg is-active" type="button" data-kind="all">全部</button>
          <button class="seg" type="button" data-kind="lost">寻物</button>
          <button class="seg" type="button" data-kind="found">招领</button>
        </div>
      </div>

      <div class="filter-row">
        <span class="filter-label" id="l-category">物品类别</span>
        <div class="chips" id="categoryChips" role="radiogroup" aria-labelledby="l-category"></div>
      </div>

    </section>

    <div class="result-bar" id="resultBar">
      <span class="result-count" id="resultCount"></span>
      <button class="result-reset" id="resetBtn" type="button" hidden>重置筛选</button>
    </div>

    <div class="item-list" id="resultList"></div>

    <!-- 没有结果时的整屏提示（原型画板 13）。
         ⚠️ 画板 13 顶上没有搜索框和筛选面板 —— 那在原型里是个独立屏幕，靠「重新搜索」退回去。
         这里把搜索框和筛选留在原地（否则用户看到「没找到」却没法改条件，只能退出去），
         插画 / 文案 / 两颗按钮则照画板做。 -->
    <div class="state-page" id="empty" hidden>
      <div class="empty-art" aria-hidden="true">
        <span class="empty-art-dog">🐩</span>
        <span class="empty-art-badge">📦</span>
      </div>
      <h3 class="state-title">暂时没有找到相关信息</h3>
      <p class="state-desc">换个关键词试试，或者发布一条信息？</p>
      <div class="state-actions">
        <button class="btn btn-primary" id="emptyReset" type="button">重新搜索</button>
        <a class="btn btn-soft-blue" href="publish.html?kind=lost"><span aria-hidden="true">🐾</span>发布寻物</a>
      </div>
    </div>

  </main>

  <div data-layout="tabbar"></div>
</div>

<script src="js/core.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/card.js"></script>
<script src="js/side-menu.js"></script>
<script>
(function () {
  'use strict';

  LF.layout.init();

  var elQ      = document.getElementById('q');
  var elClear  = document.getElementById('qClear');
  var elKind   = document.getElementById('kindSeg');
  var elCat    = document.getElementById('categoryChips');
  var elBar    = document.getElementById('resultBar');
  var elCount  = document.getElementById('resultCount');
  var elReset  = document.getElementById('resetBtn');
  var elList   = document.getElementById('resultList');
  var elEmpty  = document.getElementById('empty');

  /* 三个筛选条件，'all' 表示这一项不筛 */
  var state = {
    keyword:  LF.trim(new URLSearchParams(location.search).get('q')),   /* 允许 search.html?q=耳机 */
    kind:     'all',
    category: 'all'
  };

  /* ------------------------------------------------------------ 控件 */

  /* 「不限」+ 6 个类别。生成方式照抄 publish.html 的 renderCategories()，
     区别只是多一个「不限」项 —— 搜索页的筛选要能取消，发布页的必选不能。 */
  function renderCategories() {
    elCat.textContent = '';

    [{ id: 'all', label: '不限' }].concat(LF.CATEGORIES).forEach(function (cat) {
      var active = cat.id === state.category;
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (active ? ' is-active' : '');
      chip.dataset.category = cat.id;
      chip.setAttribute('role', 'radio');
      chip.setAttribute('aria-checked', String(active));
      chip.textContent = cat.label;
      elCat.appendChild(chip);
    });
  }

  /* 同步类型分段控件的高亮，写法同 publish.html 的 applyKind() */
  function applyKind() {
    Array.prototype.forEach.call(elKind.querySelectorAll('.seg'), function (seg) {
      var active = seg.dataset.kind === state.kind;
      seg.classList.toggle('is-active', active);
      seg.setAttribute('aria-pressed', String(active));
    });
  }

  /* ------------------------------------------------------------ 渲染 */

  function isFiltered() {
    return !!(state.keyword || state.kind !== 'all' || state.category !== 'all');
  }

  function render() {
    /* 排序和「返回副本」LF.search 都做了，这里直接用结果 */
    var hit = LF.search(LF.store.all(), {
      keyword:  state.keyword,
      kind:     state.kind,
      category: state.category
    });
    var hasHit   = hit.length > 0;
    var filtered = isFiltered();

    elClear.hidden = !state.keyword;
    elReset.hidden = !filtered;

    /* 一条都没搜到时，把计数条和列表一起收起来，让空状态独占这一屏 */
    elBar.hidden   = !hasHit;
    elList.hidden  = !hasHit;
    elEmpty.hidden = hasHit;

    elCount.textContent = filtered
      ? '找到 ' + hit.length + ' 条匹配结果'
      : '最近发布 · 共 ' + hit.length + ' 条';

    LF.card.renderList(elList, hit);
  }

  /* ------------------------------------------------------------ 交互 */

  function resetFilters() {
    state.keyword = '';
    state.kind = 'all';
    state.category = 'all';
    elQ.value = '';
    applyKind();
    renderCategories();
    render();
  }

  elQ.addEventListener('input', function () {
    state.keyword = LF.trim(elQ.value);
    render();
  });

  elKind.addEventListener('click', function (event) {
    var seg = event.target.closest('.seg');
    if (!seg) return;
    state.kind = seg.dataset.kind;
    applyKind();
    render();
  });

  elCat.addEventListener('click', function (event) {
    var chip = event.target.closest('.chip');
    if (!chip) return;
    state.category = chip.dataset.category;
    renderCategories();
    render();
  });

  elClear.addEventListener('click', function () {
    state.keyword = '';
    elQ.value = '';
    render();
    elQ.focus();
  });

  elReset.addEventListener('click', resetFilters);

  /* 空状态里的「重新搜索」= 清空全部条件 + 把光标送回输入框，接着就能重打。
     最后那句 focus 不能省：resetFilters() 会把 #empty 藏起来，而这个按钮就在里面，
     焦点会留在一个 display:none 的元素上（mine.html 的确认框踩过同一个坑）。 */
  document.getElementById('emptyReset').addEventListener('click', function () {
    resetFilters();
    elQ.focus();
  });

  /* ------------------------------------------------------------ 启动 */

  elQ.value = state.keyword;
  applyKind();
  renderCategories();
  render();
})();
</script>
</body>
</html>
